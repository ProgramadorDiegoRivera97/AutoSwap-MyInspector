<body class="tipo-prueba-page" background="../../imagenesrtm/rtm1.0.png">

    
    <div class="tipo-prueba-panel text-dark py-4 text-center fondo-trasparencia redondear-bordes">
        <h1 class="display-5 fw-bold text-white justify-content-center mb-4">Select an inspection type </h1>
        
        <div class="d-flex justify-content-center">
            <ul class="list-group w-75">
                <li class="list-group-item text-start fondo-azul letra-lista d-flex align-items-center">
                    <input class="form-check-input flex-shrink-0 inspection-check" type="radio" name="tipoInspeccion" value="mecanica" id="checkMecanica" data-completion-key="atm:inspeccion:motos:mecanica">
                    <svg class="inspection-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Car mechanical inspection">
                        <path d="M30 8a11 11 0 0 0-12 14L7 33a5 5 0 0 0 7 7l11-11A11 11 0 0 0 39 17l-7 7-8-2-2-8z" fill="none" stroke="#174ea6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                        <circle cx="12.5" cy="35.5" r="1.5" fill="#174ea6" />
                    </svg>
                    <label class="flex-grow-1" for="checkMecanica">Mechanical Inspection</label>
                    <span class="badge text-bg-success inspection-status" hidden>Completed</span>
                </li>
                <li class="list-group-item text-start fondo-azul letra-lista d-flex align-items-center">
                    <input class="form-check-input flex-shrink-0 inspection-check" type="radio" name="tipoInspeccion" value="luces" id="checkLuces" data-completion-key="atm:inspeccion:motos:luces">
                    <svg class="inspection-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Car lighting inspection">
                        <path d="M8 29h5l5-8h15l7 8h3a3 3 0 0 1 3 3v6H5v-6a3 3 0 0 1 3-3z" fill="none" stroke="#174ea6" stroke-width="3" stroke-linejoin="round" />
                        <path d="M8 29h8M40 29h4M13 38a4 4 0 1 0 8 0m8 0a4 4 0 1 0 8 0M5 24h7m-5-5 6 3m28 2h-5m5-7-6 3" fill="none" stroke="#174ea6" stroke-width="3" stroke-linecap="round" />
                    </svg>
                    <label class="flex-grow-1" for="checkLuces">Lights</label>
                    <span class="badge text-bg-success inspection-status" hidden>Completed</span>
                </li>
                <li class="list-group-item text-start fondo-azul letra-lista d-flex align-items-center">
                    <input class="form-check-input flex-shrink-0 inspection-check" type="radio" name="tipoInspeccion" value="gases" id="checkGases" data-completion-key="atm:inspeccion:motos:gases">
                    <svg class="inspection-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Car exhaust emissions inspection">
                        <path d="M7 30h18l5 5h6v5H8a4 4 0 0 1-4-4v-2a4 4 0 0 1 3-4z" fill="none" stroke="#174ea6" stroke-width="3" stroke-linejoin="round" />
                        <path d="M36 38h7m-26-8 3-5m4 5 3-5m4 5 3-5" fill="none" stroke="#174ea6" stroke-width="3" stroke-linecap="round" />
                        <circle cx="14" cy="38" r="2" fill="#174ea6" />
                    </svg>
                    <label class="flex-grow-1" for="checkGases">Emissions Inspection</label>
                    <span class="badge text-bg-success inspection-status" hidden>Completed</span>
                </li>
            </ul>
        </div>

        <div>
            <a href="#" class="btn btn-primary mt-4 px-4 disabled" id="btnIniciar"
                aria-disabled="true" tabindex="-1">Start</a>
            <div>
                <a href="../Resultados/ResultHappy.html" class="btn btn-success mt-3" id="btnResultados" hidden>
                    View Results
                </a>
            </div>
            <div class="d-flex gap-3 justify-content-center mt-3">
                <a href="pre-checking.html" class="btn btn-secondary boton-olvido">
                     Back
                </a>
            </div>
        </div>
        
    </div>

    <script>
        const radios = document.querySelectorAll(".inspection-check");
        const btnIniciar = document.getElementById("btnIniciar");
        const mecanica = document.getElementById("checkMecanica");
        const luces = document.getElementById("checkLuces");
        const gases = document.getElementById("checkGases");
        const mecanicaCompletada = sessionStorage.getItem("atm:inspeccion:motos:mecanica") === "completada";
        const lucesCompletadas = sessionStorage.getItem("atm:inspeccion:motos:luces") === "completada";
        const gasesCompletados = sessionStorage.getItem("atm:inspeccion:motos:gases") === "completada";
        const btnResultados = document.getElementById("btnResultados");
        const destinos = {
            mecanica: "MotoMecanica.html",
            luces: "MotoLuces.html",
            gases: "MotoGases.html"
        };

        btnResultados.hidden = ![
            "atm:inspeccion:motos:mecanica",
            "atm:inspeccion:motos:luces",
            "atm:inspeccion:motos:gases"
        ].every(clave => sessionStorage.getItem(clave) === "completada");

        mecanica.disabled = mecanicaCompletada;
        luces.disabled = !mecanicaCompletada || lucesCompletadas;
        gases.disabled = !lucesCompletadas || gasesCompletados;

        radios.forEach(radio => {
            const completada = sessionStorage.getItem(radio.dataset.completionKey) === "completada";
            radio.closest(".list-group-item").classList.toggle("inspection-completed", completada);
            radio.parentElement.querySelector(".inspection-status").hidden = !completada;
        });

        radios.forEach(radio => {
            radio.addEventListener("change", function () {
                if (!this.checked) return;

                btnIniciar.href = destinos[this.value];
                btnIniciar.classList.remove("disabled");
                btnIniciar.setAttribute("aria-disabled", "false");
                btnIniciar.removeAttribute("tabindex");
            });
        });

        btnIniciar.addEventListener("click", function (event) {
            if (btnIniciar.classList.contains("disabled")) event.preventDefault();
        });

    </script>

    <script src="../../assets/dist/js/bootstrap.bundle.min.js"></script>

</html>
